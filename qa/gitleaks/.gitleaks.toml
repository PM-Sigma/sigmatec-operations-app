# Gitleaks config for the Sigmatec Operations App (QA gate 1).
#
# Run:  qa/bin/gitleaks.exe detect  --source . --config qa/gitleaks/.gitleaks.toml --no-banner --no-git
#       qa/bin/gitleaks.exe protect --staged --config qa/gitleaks/.gitleaks.toml --no-banner
#
# Extends the upstream default ruleset, then allowlists ONLY strings that are public by design or
# proven false positives. Everything else that looks like a secret is a real finding and must be
# rotated + removed from the tree (the service_role key was leaked once already — see CLAUDE.md).

[extend]
useDefault = true

[allowlist]
description = """
Public-by-design strings and documented false positives. Each entry states WHY the value is safe.
Do not add anything here without that justification.
"""

  # ── Paths that are generated, vendored, or QA output ───────────────────────────────────────
  paths = [
    # js/app.js is generated by `node build.mjs` from js/src/*.js — same content, scanned there.
    '''^js/app\.js$''',
    # ui/ is the Vite build output of app/ — same content, scanned in app/src.
    '''^ui/''',
    '''^app/dist/''',
    '''^node_modules/''',
    '''^app/node_modules/''',
    # QA tool output (reports quote findings verbatim; the Playwright shots are binary).
    '''^qa/reports/''',
    '''^qa/playwright/shots/''',
    '''^qa/bin/''',
    # Downloaded semgrep rule packs: their *patterns* contain example secrets by definition.
    '''^qa/semgrep/\.cache/''',
    '''^test-results/''',
    # Lockfiles hold registry integrity hashes, not secrets.
    '''package-lock\.json$''',
    # Superpowers process scratch (review diffs of tracked code). Untracked, and it mirrors
    # js/ + app/src line for line, so a real secret there is already caught at its source file.
    '''^\.superpowers/''',
  ]

  # ── Individual allowlisted values ──────────────────────────────────────────────────────────
  regexes = [
    # 1. Supabase ANON key (project wwqfcajnxinaxmobrgol). PUBLIC BY DESIGN.
    #    A signed JWT whose payload is {"role":"anon"}. It is designed to be embedded in every
    #    browser client; it grants nothing on its own — all access is decided by Postgres RLS
    #    policies (see db/rls_*.sql). Leaking it is equivalent to leaking the project URL.
    #    Lives in: js/src/01-data.js, js/src/22-push.js (x2), app/src/lib/supabase.ts.
    #    NOTE: the SERVICE_ROLE key of the same project is NOT allowlisted anywhere — it
    #    bypasses RLS and must never appear in the tree.
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3cWZjYWpueGluYXhtb2JyZ29sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTM3MTcsImV4cCI6MjA5NzY2OTcxN30\.4kaIyZ1WbkHDHCfa-1iXAqDdgJOQqK_cUomvELLT7u4''',

    # 2. VAPID *public* key for Web Push (js/src/22-push.js). PUBLIC BY DESIGN.
    #    The public half of the application server key pair. The browser needs it to create a
    #    push subscription (PushManager.subscribe applicationServerKey), so it must ship to the
    #    client. The private half exists only as a Supabase Edge Function secret (VAPID_PRIVATE)
    #    and is never in the repo.
    '''BFIsMdmbzVjYVF5ZdYp89modREfn7hw-lMrV3a7rDIs1ctkUvKpxb1skMLHFLzOS98XBqkPazZhCXHuKWQHx8mM''',

    # 3. FALSE POSITIVE of the default `generic-api-key` rule, which fires on any
    #    `<word>_KEY = '<string>'`. These are localStorage key NAMES (string identifiers, not
    #    secret values): sigma_cmd_recents_v1 (app/src/lib/commands.ts),
    #    sigma_landed_v1 (app/src/lib/landing.ts), and the rest of the sigma_*_v<n> family.
    '''sigma_[a-z_]+_v\d+''',

    # 4. FALSE POSITIVE — a deliberately fake HMAC secret used as test input in the vitest
    #    fixture app/src/lib/usageDigest.test.ts. Not a credential for anything.
    '''sekrit-cron-key-0123456789''',
  ]
