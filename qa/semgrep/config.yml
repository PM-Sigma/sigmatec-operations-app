# Semgrep manifest for the Sigmatec Operations App (QA gate 2).
#
# Semgrep has no file format for "a list of registry rulesets", so this manifest is the single
# source of truth and `scripts/qa.mjs` reads it: it fetches the packs into `cache` (once, then the
# gate is fully offline), runs one scan, and applies `exclude_rules` to the JSON results itself
# (matching on the check_id suffix — semgrep prefixes ids with the config path when rules are
# loaded from a local directory, so the suffix is the stable part).
#
# Run:   npm run qa -- --only semgrep
# Manual:
#   semgrep scan --config qa/semgrep/.cache --metrics=off --severity=ERROR --severity=WARNING \
#     --exclude node_modules --exclude js/app.js --exclude ui --exclude qa --json-output out.json .
#
# Binding threshold: 0 ERROR / 0 WARNING after exclusions.

rulesets:              # downloaded from https://semgrep.dev/c/<ruleset>
  - p/default
  - p/owasp-top-ten
  - p/javascript
  - p/typescript

severities:            # severities that fail the gate
  - ERROR
  - WARNING

cache: qa/semgrep/.cache   # offline rule packs (gitignored; re-fetched automatically if missing)

# Paths never scanned: generated bundles, vendored code, QA tooling, process scratch.
# (Mirrored in qa/semgrep/.semgrepignore for manual runs with --x-semgrepignore-filename.)
exclude:
  - node_modules
  - js/app.js          # generated by build.mjs from js/src/*.js — scanned there instead
  - ui                 # Vite build output of app/ — scanned in app/src instead
  - dist
  - qa                 # rule packs, binaries, reports, screenshots
  - test-results
  - .superpowers       # untracked review diffs; mirror tracked source line for line

# ── Accepted findings (reviewed 2026-09-18, Task 22) ─────────────────────────────────────────
# Rules suppressed repo-wide. Every entry names the sites reviewed and why the finding is
# accepted. Prefer fixing the code; when a new site appears under one of these rules it is NOT
# automatically safe — re-review it and record it here.
exclude_rules:

  - id: generic.secrets.security.detected-jwt-token.detected-jwt-token
    why: >
      All 9 hits are the same Supabase ANON key (role:"anon") of project wwqfcajnxinaxmobrgol,
      which is public by design and must ship in the browser bundle; access is decided by RLS.
      Sites: js/src/01-data.js:370, js/src/22-push.js:9+119, js/src/24-kibbutzim.js:158,
      app/src/lib/supabase.ts:19, db/kibbutzim_seed.mjs:30, stats.html:308,
      supabase/functions/parse-order/index.ts:14. Secret detection is owned by gate 1
      (gitleaks), whose `jwt` rule allowlists ONLY that exact value — verified on 2026-09-18 that
      a fabricated service_role JWT dropped into the tree is still reported by gitleaks, so
      suppressing the duplicate semgrep rule loses no coverage.

  - id: generic.unicode.security.bidi.contains-bidirectional-characters
    why: >
      The product is a Hebrew RTL app; bidi control characters appear on purpose. Sites:
      app/src/lib/meetingNotes.ts:109 and js/src/21-excel-export.js:15 are the sanitizers that
      STRIP bidi marks out of pasted text / exported cells, and test-exports.mjs:37 is the test
      asserting they were stripped. The characters sit inside character classes of those
      regexes, never in an executable position.

  - id: javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
    why: >
      5 hits, all building a RegExp from a person name or a board label that is escaped first
      with .replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), so no metacharacter survives and the pattern
      shape is fixed (no nested quantifiers → no ReDoS). Sites: js/src/12-reports.js:29+37,
      supabase/functions/github/index.ts:118+127, test-ems-labels.mjs:42.

  - id: javascript.lang.security.audit.unknown-value-with-script-tag.unknown-value-with-script-tag
    why: >
      1 hit, js/src/04-attendance-daily.js:272 — the attendance print view document.write()s a
      same-origin popup whose only <script> is the literal `window.onload=window.print()`. The
      interpolated values sit in the HTML body, not inside the script tag, and are the user's own
      attendance rows (already-assembled markup), so escaping them would break the intended
      table. FLAGGED TO THE CONTROLLER as a low-severity product finding: if that print view ever
      renders third-party text, it needs an escaping pass.

  - id: javascript.lang.security.insecure-object-assign.insecure-object-assign
    why: >
      2 hits, js/src/01-data.js:320+561 — Object.assign({ id, at }, body.item || {}) merges an
      app-generated queue item into a fresh literal inside the mock router / Supabase writer. The
      source object comes from this app's own code paths, not from request input, and the result
      is a plain row payload that is never used as a prototype.

  - id: javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
    why: >
      1 hit, test-cert-pdf.mjs:98 — a legacy test runner joining a path from module-local
      constants. No external input; test-only file, never shipped.

